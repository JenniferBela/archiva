<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Archiva</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>

    <main class="connexion-page">

        <section class="connexion-card">

            <div class="connexion-form">

                <h1>Se connecter</h1>

                <div class="connexion-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Entrez votre adresse email">
                </div>

                <div class="connexion-group">
                    <label for="password">Mot de passe</label>

                    <div class="password-input">
                        <input type="password" id="password" placeholder="Entrez votre mot de passe">
                        <button type="button" class="eye">◉</button>
                    </div>

                    <a href="#" class="mot-de-passe-oublie">
                        Mot de passe oublié ?
                    </a>

                </div>    

                <button id="connexion" class="connexion-submit">
                    Se connecter
                </button>

                <p class="creation-compte">
                    Vous n'avez pas de compte ?
                    <a href="inscription.html">Créer un nouveau compte</a>
                </p>

            </div>

            <div class="connexion-image">
                <img src="styles/assets/images.jpg">
            </div>
            
        </section>
    </main>
    <script src="js/script.js"></script>
</body>
