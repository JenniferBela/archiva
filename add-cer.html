<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content=""width=device-width, initial-scale="1.0">
    <title>Ajouter un CER - Archiva</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>

    <main>
        <section class="ajouter-cer-page">

            <div class="ajouter-cer-header">
                <h1>Ajouter un nouveau CER</h1>
                <button class="fermer">x</button>
            </div>

            <div class="form-group">
                <label>Titre du CER</label>
                <input type="text" id="titre" placeholder="Entrez le titre du CER">
            </div>

            <div class="form-group">
                <label>Niveau</label>

                <select id="niveau">
                    <option value="">Selectionnez un niveau</option>
                    <option value="X1">X1</option>
                    <option value="X2">X2</option>
                    <option value="X3">X3</option>
                    <option value="X4">X4</option>
                    <option value="X5">X5</option>
                </select>
            </div>

            <div class="form-group">
                <label>Domaines de Specialite</label>

                <div class="domaines-checkbox">

                    <label>
                        <input type="checkbox" class="specialite-cb" value="Reseaux et Infra">
                        Reseaux et Infra
                    </label>

                    <label>
                        <input type="checkbox" class="specialite-cb" value="Genie Logiciel">
                        Genie Logiciel
                    </label>

                    <label>
                        <input type="checkbox" class="specialite-cb" value="Gestion de Projet">
                        Gestion de Projet
                    </label>

                    <label>
                        <input type="checkbox" class="specialite-cb" value="Data">
                        Data
                    </label>

                    <label>
                        <input type="checkbox" class="specialite-cb" value="Securite">
                        Securite
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Description du CER</label>

                <textarea id="description" placeholder="Decrivez le CER..."></textarea>

            </div>

            <div class="form-group">
                <label>Fichiers du CER</label>

                <label class="fichier-box">
                    <span class="fichier-icon">+</span>
                    <em>Cliquez ici pour attacher le fichier CER (.pdf ou .docx)</em>
                    <input type="file" accept=".pdf,.doc,.docx">
                </label>
            </div>

            <button id="enregistrer-btn" class="enregistrer">Enregistrer</button>
        </section>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
