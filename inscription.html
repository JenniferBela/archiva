<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un compte - Archiva</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>

    <main class="connexion-page">

        <section class="connexion-card">

            <div class="connexion-form">

                <h1>Créer un compte</h1>

                <div class="connexion-group">
                    <label for="nom">Nom complet</label>
                    <input type="text" id="nom" placeholder="Entrez votre nom complet">
                </div>

                <div class="connexion-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Entrez votre adresse email">
                </div>

                <div class="connexion-group">
                    <label for="niveau">Niveau</label>
                    <select id="niveau">
                        <option value="">Sélectionnez votre niveau</option>
                        <option value="x1">X1</option>
                        <option value="x2">X2</option>
                        <option value="x3">X3</option>
                        <option value="x4">X4</option>
                        <option value="x5">X5</option>
                    </select>
                </div>

                <div class="connexion-group">
                    <label for="password">Mot de passe</label>

                    <div class="password-input">
                        <input type="password" id="password" placeholder="Entrez votre mot de passe">
                        <button type="button" class="eye">◉</button>
                    </div>
                </div>

                <p id="message"></p>
                <button id="creerCompte" class="connexion-submit">
                    Créer un compte
                </button>

                <p class="creation-compte">
                    Vous avez déjà un compte ?
                    <a href="connexion.html">Connectez-vous</a>
                </p>

            </div>

            <div class="connexion-image">
                <img src="styles/assets/images.jpg">
            </div>

        </section>

    </main>
    <script src="js/script.js"></script>

</body>
</html>
